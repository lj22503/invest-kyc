<div class="quiz-container">

    <!-- 封面 -->

      <div class="hero-emoji">🐾</div>

      <p class="start-desc">
        不是问你想要多少收益。是问，你的行为模式是什么。<br>
        12只投资宠物，对应12种真实存在的行为偏差。<br>
        没有人是"理性人"，但有人更了解自己。

      <button class="btn btn-primary btn-lg" onclick="startQuiz()">开始测试 →</button>

    </div>

    <!-- 问题区 -->
    <div id="questionScreen" style="display:none;">

      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressText">第 1 题 / 共 10 题</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="question-wrap">
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
      </div>
      <div class="quiz-nav">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" style="visibility:hidden">← 上题</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>下题 →</button>
      </div>
    </div>

    <!-- 结果区 -->
    <div class="result-screen" id="resultScreen" style="display:none;">
      <div class="result-emoji" id="resultEmoji">🐿️</div>

      </div>
      <div class="cta-group">

</div>

// ===== 10题数据（5维度×各2题）=====
const QUESTIONS = [
  {

  {

    opts: [
      { letter: 'A', text: '心动，但忍住不追', pets: ['wugui', 'tuotuo'] },
      { letter: 'B', text: '赶紧研究一下，是不是真有机会', pets: ['maotouying', 'dujiao'] },
      { letter: 'C', text: '先买一点试试水', pets: ['bianshi', 'haitun'] },
      { letter: 'D', text: '全仓杀入，错过就没了！', pets: ['lang', 'shizi'] },
    ]
  },
  {
    q: '你多久看一次自己的基金/股票账户？',
    opts: [
      { letter: 'A', text: '一个月一次，怕看到亏损', pets: ['wugui', 'songguo'] },
      { letter: 'B', text: '每天一次，看看涨跌', pets: ['haitun', 'bianshi'] },
      { letter: 'C', text: '每天N次，盯盘是爱好', pets: ['tiao', 'aoxiang'] },

    ]
  },
  {

    opts: [

      { letter: 'B', text: '找到好公司，长期拿着', pets: ['shizi', 'maotouying'] },
      { letter: 'C', text: '低买高卖，把握节奏', pets: ['tiao', 'aoxiang'] },
      { letter: 'D', text: '分散风险，别赌单边', pets: ['bianshi', 'haitun'] },
    ]
  },
  {
    q: '你的账户亏了多少你会开始焦虑？',
    opts: [
      { letter: 'A', text: '亏5%就开始焦虑', pets: ['mayi', 'songguo'] },
      { letter: 'B', text: '亏10%还能接受', pets: ['haitun', 'bianshi', 'daxiang'] },
      { letter: 'C', text: '亏20%也淡定', pets: ['wugui', 'tuotuo', 'maotouying'] },
      { letter: 'D', text: '亏？那是加仓机会！', pets: ['shizi', 'lang', 'dujiao'] },
    ]
  },
  {
    q: '"别人恐惧我贪婪，别人贪婪我恐惧"这句话你怎么看？',
    opts: [
      { letter: 'A', text: '有道理，但我做不到', pets: ['songguo', 'haitun', 'mayi'] },
      { letter: 'B', text: '这就是我的人生信条！', pets: ['tuotuo', 'shizi'] },
      { letter: 'C', text: '要看情况，不能盲目', pets: ['maotouying', 'bianshi'] },
      { letter: 'D', text: '我已经在执行了', pets: ['lang', 'aoxiang'] },
    ]
  },
  {
    q: '你平时通过什么渠道学习投资？',
    opts: [
      { letter: 'A', text: '看书/经典投资著作', pets: ['wugui', 'maotouying', 'tuotuo'] },
      { letter: 'B', text: '看公众号/大V/博主', pets: ['haitun', 'bianshi', 'mayi'] },
      { letter: 'C', text: '自己摸索，实战经验', pets: ['shizi', 'lang', 'tiao'] },
      { letter: 'D', text: '系统学习过金融/投资专业', pets: ['dujiao', 'aoxiang'] },
    ]
  },
  {
    q: '你倾向什么样的投资回报预期？',
    opts: [
      { letter: 'A', text: '跑赢通胀就行，年化5%-8%很满意', pets: ['daxiang', 'songguo', 'wugui'] },
      { letter: 'B', text: '希望10%-15%，愿意为此承受一定波动', pets: ['maotouying', 'bianshi', 'haitun'] },

    ]
  },
  {

      { letter: 'A', text: '历史数据——过去验证过的策略', pets: ['maotouying', 'wugui', 'daxiang'] },
      { letter: 'B', text: '自己的判断——我比市场聪明', pets: ['lang', 'shizi', 'tuotuo'] },
      { letter: 'C', text: '市场共识——大家买什么我买什么', pets: ['haitun', 'bianshi'] },
      { letter: 'D', text: '直觉——我运气一直不错', pets: ['tiao', 'dujiao', 'aoxiang'] },
    ]

// ===== 宠物对话模板（展示用）=====
const PET_BUBBLES = {
  songguo: '慢慢来，比较快。定投的意义在于——你在积累便宜筹码，不是在追逐热点。',
  wugui: '时间会奖励耐心。你现在的任务就是：什么都不做，等。',
  daxiang: '别把鸡蛋放一个篮子。你的风险已经很低了，不需要为了收益冒额外的险。',
  lang: '机会来的时候，要重仓。但重仓的前提是：你真的研究清楚了。',
  shizi: '分散是对无知的保护——但你既然研究清楚了，集中也是一种信念。',
  haitun: '风口来了猪都能飞。但风停了呢？你有没有想过这个？',
  tiao: '见好就收没问题。但你每次"好"的定义是什么？提前定好，才能执行。',
  maotouying: '让我看看数据。数据不会说谎——说谎的，是你选择性地看数据。',
  bianshi: '顺势而为是对的。但你要分清楚：是市场真的变了，还是你只是不想承认错了。',
  aoxiang: 'A股只是世界的一部分。你去看看美股、港股，你会发现更多机会。',
  bazhua: '多条腿走路是聪明的。但你有没有想过，你同时在管几条腿？',
  dujiao: '成长是最大的价值。但"成长"的定义是什么？规模？营收？还是用户？',
  tuotuo: '人弃我取。这是逆向投资的核心——但你得确定你不是在接飞刀。',
  mayi: '活着最重要。你已经超过大多数人了，因为你没有亏钱。',
};

// ===== 测试状态 =====
let currentQ = 0;
let answers = []; // 每个问题选中的 pet 数组
let selectedOptions = []; // 每题选中的选项索引

function startQuiz() {
  currentQ = 0;
  answers = [];
  selectedOptions = [];
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('questionScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('progressText').textContent = `第 ${currentQ + 1} 题 / 共 ${QUESTIONS.length} 题`;
  const pct = Math.round((currentQ / QUESTIONS.length) * 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option' + (selectedOptions[currentQ] === idx ? ' selected' : '');
    btn.onclick = () => selectOption(idx);
    btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span class="opt-text">${opt.text}</span>`;
    container.appendChild(btn);
  });

  document.getElementById('prevBtn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = currentQ === QUESTIONS.length - 1 ? '查看结果 →' : '下题 →';
  document.getElementById('nextBtn').disabled = selectedOptions[currentQ] === undefined;
}

function selectOption(idx) {
  selectedOptions[currentQ] = idx;
  const q = QUESTIONS[currentQ];
  answers[currentQ] = q.opts[idx].pets;
  // 重新渲染选项状态
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (selectedOptions[currentQ] === undefined) return;
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  // 计算每个宠物的得分
  const petScores = {};
  answers.forEach(pets => {
    pets.forEach(pet => {
      petScores[pet] = (petScores[pet] || 0) + 1;
    });
  });

  // 排序，取 Top
  const sorted = Object.entries(petScores).sort((a, b) => b[1] - a[1]);
  const bestId = sorted[0][0];
  const bestPet = PETS_INFO[bestId] || PETS_INFO['songguo'];
  const top3 = sorted.slice(0, 3);
  const matchRate = Math.min(95, 55 + sorted[0][1] * 5);

  document.getElementById('resultEmoji').textContent = bestPet.emoji;
  document.getElementById('resultPetName').textContent = `${bestPet.emoji} ${bestPet.name}`;
  document.getElementById('resultLabel').textContent = `投资人格：${bestPet.style}`;
  document.getElementById('resultMatch').textContent = `匹配度：${matchRate}%`;

  const tagsEl = document.getElementById('resultTags');
  tagsEl.innerHTML = `
    <span class="badge badge-gold">${bestPet.catchphrase}</span>
    <span class="badge badge-muted">${bestPet.style}</span>
  `;

  const bubbleEl = document.getElementById('resultBubble');
  const bubbleText = PET_BUBBLES[bestId] || PET_BUBBLES['songguo'];
  bubbleEl.innerHTML = `<strong>${bestPet.emoji} ${bestPet.name}：</strong>${bubbleText}`;

  // Top3
  const top3El = document.getElementById('top3Container');
  top3El.innerHTML = '';
  top3.forEach((item, i) => {
    const pet = PETS_INFO[item[0]] || PETS_INFO['songguo'];
    const m = Math.min(95, 55 + item[1] * 5);
    top3El.innerHTML += `
      <div class="top3-item">
        <div class="top3-emoji">${pet.emoji}</div>
        <div class="top3-info">
          <div class="top3-name">${i + 1}. ${pet.name}</div>
          <div class="top3-style">${pet.style}</div>
        </div>
        <div class="top3-match">${m}%</div>
      </div>
    `;
  });

  // CTA：中间定向到 Skill 安装
  const ctaBtn = document.getElementById('getPetBtn');
  const skillUrl = `https://clawhub.ai/lj22503/investment-buddy-pet?pet=${bestId}`;
  ctaBtn.href = skillUrl;
}

function retakeTest() {
  startQuiz();
}

// 移动端菜单
document.querySelector('.mobile-menu-btn')?.addEventListener('click', () => {
  document.querySelector('.nav-links')?.classList.toggle('open');
});
</script>

</body>
